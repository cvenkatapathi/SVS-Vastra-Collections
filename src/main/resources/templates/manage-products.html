<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | SVS Vastra Collections</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="admin-container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>SVS Admin</h2>

        <ul>

            <li><a href="/admin/dashboard">Dashboard</a></li>

            <li><a href="/admin/add-product">Add Product</a></li>

            <li><a href="/admin/products" class="active">Manage Products</a></li>

            <li><a href="/admin/orders">Orders</a></li>

            <li><a href="/customers">Customers</a></li>

            <li><a href="/sales-report">Sales Report</a></li>

            <li><a href="/settings">Settings</a></li>

            <li><a href="/admin/login">Logout</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="dashboard-content">

        <h1>Manage Products</h1>

        <table class="admin-table">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>1</td>

                    <td>
                        <img src="images/sarees/product1.jpg" width="70">
                    </td>

                    <td>Premium Silk Saree</td>

                    <td>Silk</td>

                    <td>₹2,499</td>

                    <td>25</td>

                    <td>

                        <a href="edit-product.html">
                            <button class="edit-btn">Edit</button>
                        </a>

                        <button class="delete-btn">
                            Delete
                        </button>

                    </td>

                </tr>

                <tr>

                    <td>2</td>

                    <td>
                        <img src="images/sarees/product2.jpg" width="70">
                    </td>

                    <td>Designer Saree</td>

                    <td>Designer</td>

                    <td>₹3,999</td>

                    <td>18</td>

                    <td>

                        <a href="edit-product.html">
                            <button class="edit-btn">Edit</button>
                        </a>

                        <button class="delete-btn">
                            Delete
                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
