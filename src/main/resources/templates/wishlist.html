<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wishlist | SVS Vastra Collections</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

<nav class="navbar">

    <div class="logo">
        SVS Vastra Collections
    </div>


    <ul class="nav-links">

        <li>
            <a href="/">
                Home
            </a>
        </li>

        <li>
            <a href="/shop">
                Shop
            </a>
        </li>

        <li>
            <a href="/wishlist"
               class="active">
                Wishlist
            </a>
        </li>

        <li>
            <a href="/cart">
                Cart
            </a>
        </li>

        <li>
            <a href="/login">
                Login
            </a>
        </li>

    </ul>

</nav>


<section class="wishlist">

    <h1>
        My Wishlist
    </h1>


    <!-- Products are inserted by app.js -->

    <div class="products"
         id="wishlistProducts">
    </div>


    <!-- Empty wishlist -->

    <div class="empty-wishlist-message"
         id="emptyWishlistMessage"
         style="display: none;">

        <h2>
            Your Wishlist is Empty
        </h2>

        <p>
            You haven't added any products to your wishlist yet.
        </p>

        <a href="/shop">
            Continue Shopping
        </a>

    </div>

</section>


<script src="/js/app.js"></script>

</body>

</html>
