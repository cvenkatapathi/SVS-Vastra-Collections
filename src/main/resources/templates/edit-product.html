<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product | SVS Vastra Collections</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="admin-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>SVS Admin</h2>

        <ul>

            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/add-product">Add Product</a></li>
            <li><a href=" /admin/products" class="active">Manage Products</a></li>
            <li><a href="/admin/orders">Orders</a></li>
            <li><a href="/customers">Customers</a></li>
            <li><a href="/sales-report">Sales Report</a></li>
            <li><a href="/settings">Settings</a></li>
            <li><a href="/admin/login">Logout</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="dashboard-content">

        <h1>Edit Product</h1>

        <form class="product-form">

            <input type="text" value="Premium Silk Saree">

            <input type="number" value="2499">

            <input type="text" value="Silk">

            <input type="number" value="25" placeholder="Stock Quantity">

            <textarea rows="6">Beautiful Premium Silk Saree suitable for weddings and festivals.</textarea>

            <label>Change Product Image</label>

            <input type="file">

            <button type="submit">
                Update Product
            </button>

        </form>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
